[project]
name = "interview-ai-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rizan Shrestha", email = "rcesstha@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
interview-ai-assistant = "interview_ai_assistant:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
